<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="promo.css">
<style>
.laptop{position:absolute;left:230px;top:430px;width:760px}
.screen{height:430px;border-radius:26px 26px 6px 6px;border:10px solid #2a3253;background:#0d1120;display:grid;place-items:center;position:relative;overflow:hidden}
.base{height:26px;margin:0 -60px;border-radius:0 0 40px 40px;background:linear-gradient(#3a4470,#232a4a)}
.screen svg.m{width:120px;height:120px}
.lock{position:absolute;right:28px;bottom:26px;width:64px;height:64px}
.lock path,.lock rect{fill:none;stroke:#8a9bff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ticks{position:absolute;left:1130px;top:470px;width:640px}
.tk{display:flex;align-items:center;gap:26px;font-size:46px;font-weight:600;letter-spacing:-.02em;margin-bottom:44px}
.tk .c{width:64px;height:64px;border-radius:50%;flex:none;background:rgba(138,155,255,.16);border:2px solid rgba(138,155,255,.6);display:grid;place-items:center}
.tk svg{width:34px;height:34px;stroke:#c7cffb;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.tk svg path{stroke-dasharray:40;stroke-dashoffset:40}
.go .tk svg path{animation:draw .6s ease calc(var(--d) + .5s) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.cloud{position:absolute;left:800px;top:350px;width:210px;opacity:0}
.go .cloud{animation:cl 1s ease 1.6s forwards}@keyframes cl{to{opacity:.9}}
.cloud *{fill:none;stroke:#6f7aa3;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cloud .s{stroke:#f87171;stroke-width:3.4}
</style>
