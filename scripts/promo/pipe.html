svg.lines{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
svg.lines path{fill:none;stroke:#8a9bff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:3 16;opacity:0}
.go svg.lines path{animation:show .8s ease var(--d) forwards,flow 1.4s linear var(--d) infinite}
@keyframes show{to{opacity:.7}}@keyframes flow{to{stroke-dashoffset:-38}}
.key{position:absolute;bottom:96px;left:0;right:0;text-align:center;font-size:30px;color:#9aa5c8}
.key i{display:inline-block;width:14px;height:14px;border-radius:4px;margin:0 10px 0 28px;vertical-align:-1px}
