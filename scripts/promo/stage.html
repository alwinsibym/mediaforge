<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="promo.css">
<style>
.f{position:absolute;overflow:hidden;background:#0d1120;opacity:0;transform:translateY(90px) rotateX(16deg) rotateY(-12deg) scale(.93);
  box-shadow:0 70px 140px -40px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.1),0 0 220px rgba(120,140,255,.14)}
.go .f{animation:rise 1.5s cubic-bezier(.16,1,.3,1) var(--d,.1s) both}
@keyframes rise{from{opacity:0;transform:translateY(90px) rotateX(16deg) rotateY(-12deg) scale(.93)}to{opacity:1;transform:none}}
iframe{width:100%;height:100%;border:0;display:block}
.win{left:192px;top:108px;width:1536px;height:864px;border-radius:26px}
.desk{left:70px;top:290px;width:880px;height:560px;border-radius:20px;--d:.1s}
.tab{left:990px;top:170px;width:500px;height:740px;border-radius:34px;border:9px solid #0a0d19;--d:.35s}
.ph{left:1530px;top:236px;width:330px;height:660px;border-radius:48px;border:10px solid #0a0d19;--d:.6s}
</style>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
<div id="root" style="position:absolute;inset:0;perspective:2600px"></div>
<script>
const q=new URLSearchParams(location.search),app=q.get("app"),root=document.getElementById("root");
const add=(cls,id)=>{const d=document.createElement("div");d.className="f "+cls;const f=document.createElement("iframe");f.id=id;f.src=app;f.title="MediaForge";d.append(f);root.append(d)};
if(q.get("mode")==="devices"){add("desk","f1");add("tab","f2");add("ph","f3")}else add("win","f1");
</script>
